<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeros - Simulateur de Signes Vitaux</title>
    <meta
      name="description"
      content="Simulateur de moniteur de signes vitaux en temps réel pour la formation en santé."
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body class="accueil">
    <main>
      <h1><span class="brand-logo home-logo">AEROS</span></h1>
      <p class="home-subtitle">
        Simulateur de moniteur de signes vitaux pour la formation en santé.
      </p>

      <div class="room-input-container">
        <label for="room-code" class="room-input-label">Code de connexion</label>
        <input
          type="text"
          id="room-code"
          class="room-input-field"
          placeholder="1234"
          maxlength="8"
          autocomplete="off"
          aria-describedby="room-hint"
        />
        <p id="room-hint" class="room-input-hint">
          ⚠️ Pour relier un Moniteur et un Pilote, veillez à utiliser
          <strong>le même code</strong> sur les deux appareils.
        </p>
      </div>

      <div class="menu-container">
        <a href="monitor.html" id="btn-join-monitor" class="menu-btn" role="button">
          <div class="btn-icon" aria-hidden="true">📺</div>
          <div class="btn-text">Moniteur</div>
        </a>

        <a href="pilote.html" id="btn-join-pilote" class="menu-btn" role="button">
          <div class="btn-icon" aria-hidden="true">🎛️</div>
          <div class="btn-text">Pilote</div>
        </a>
      </div>

      <footer class="footer-info">
        <p>Développé par <strong>Lucas Séraudie</strong></p>
        <p>Licence <strong>GNU AGPLv3</strong></p>
      </footer>
    </main>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
