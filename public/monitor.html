<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeros Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="monitor-mode">

    <audio id="audio-cuff" src="/ta.mp3" preload="auto"></audio>

    <div class="monitor-frame">
        
        <div class="top-bar">
            <div class="monitor-logo brand-logo">AEROS</div>
            <div class="patient-info">ADULTE - STANDARD</div>
            <div class="top-right">
                <div id="clock">--:--</div>
                <button id="btn-fs" class="fs-btn" title="Plein écran">⛶</button>
            </div>
        </div>

        <div class="monitor-grid">
            
            <div class="param-box hr-box">
                <div class="module-content">
                    <div class="label-zone">
                        <span class="label-text">FC</span>
                        <span class="label-unit">bpm</span>
                    </div>
                    <div class="value-zone">
                        <div class="icon-heart">♥</div>
                        <span id="bpm-disp" class="value value-blur">--</span>
                    </div>
                </div>
                <div class="wave-container"><div class="fake-wave"></div></div>
            </div>

            <div class="param-box spo2-box">
                <div class="module-content">
                    <div class="label-zone">
                        <span class="label-text">SpO2</span>
                        <span class="label-unit">%</span>
                    </div>
                    <div class="value-zone">
                        <span id="spo2-disp" class="value value-blur">--</span>
                    </div>
                </div>
                <div class="wave-container"><div class="fake-wave"></div></div>
            </div>

            <div class="param-box nibp-box">
                <div class="module-content">
                    <div class="label-zone">
                        <span class="label-text">PNI</span>
                        <span class="label-unit">mmHg</span>
                    </div>
                    
                    <div class="nibp-content">
                        <div class="nibp-main">
                            <span id="sys-disp" class="value value-blur">--</span>
                            <span class="sep">/</span>
                            <span id="dia-disp" class="value value-blur">--</span>
                        </div>
                        <div class="nibp-sub">
                            PAM (<span id="map-disp" class="value-blur">--</span>)
                        </div>
                    </div>
                </div>
            </div>

            <div class="param-box control-box">
                <div class="control-inner">
                    <div class="system-status">
                        <span id="status-msg">Prêt</span>
                        <span id="countdown" class="countdown-display"></span>
                    </div>
                    
                    <div class="buttons-row">
                        <button id="btn-oneshot" class="monitor-btn">Start</button>
                        <button id="btn-continue" class="monitor-btn">Auto</button>
                        <button id="btn-stop" class="monitor-btn btn-red" disabled>Stop</button>
                    </div>
                </div>
            </div>

        </div> </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Configuration Audio
        const audioPlayer = new Audio('/ta.mp3'); 
        const alertPlayer = new Audio('/alert.mp3'); 

        let serverBuffer = { bpm: '--', spo2: '--', sys: '--', dia: '--' };
        let countdownTimer = null;
        let isContinuous = false;

        const els = {
            bpm: document.getElementById('bpm-disp'),
            spo2: document.getElementById('spo2-disp'),
            sys: document.getElementById('sys-disp'),
            dia: document.getElementById('dia-disp'),
            map: document.getElementById('map-disp'),
            status: document.getElementById('status-msg'),
            countdown: document.getElementById('countdown'),
            btnOne: document.getElementById('btn-oneshot'),
            btnCont: document.getElementById('btn-continue'),
            btnStop: document.getElementById('btn-stop'),
            btnFs: document.getElementById('btn-fs')
        };

        // Fullscreen
        els.btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        // Horloge
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        socket.on('updateParams', (data) => { serverBuffer = data; });

        // LOGIQUE BOUTONS
        els.btnOne.addEventListener('click', () => {
            stopAllCycles();
            els.btnOne.classList.add('active-btn', 'btn-blue');
            performMeasurement();
        });

        els.btnCont.addEventListener('click', () => {
            stopAllCycles();
            isContinuous = true;
            els.btnStop.disabled = false;
            els.btnCont.classList.add('active-mode', 'btn-orange');
            performMeasurement();
            startCycleCountdown(120);
        });

        els.btnStop.addEventListener('click', () => {
            stopAllCycles();
            els.status.innerText = "Arrêté";
            els.status.classList.remove('analyzing-alert');
        });

        function performMeasurement() {
            audioPlayer.currentTime = 0;
            audioPlayer.play().catch(e => console.log("Audio bloqué par navigateur"));

            els.status.innerText = "ANALYSE...";
            els.status.classList.add('analyzing-alert');
            setValuesOpacity(0.5);
            
            setTimeout(() => {
                updateDisplayFromBuffer();
                setValuesOpacity(1);
                els.status.classList.remove('analyzing-alert');
                
                checkAlerts();

                if(!isContinuous) els.btnOne.classList.remove('active-btn', 'btn-blue');

                const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                if(isContinuous) { els.status.innerText = `Dernière : ${time}`; } 
                else { els.status.innerText = `Mesure : ${time}`; }
            }, 7000); 
        }

        // --- GESTION DES ALERTES MISE À JOUR ---
        function checkAlerts() {
            const sysVal = parseInt(serverBuffer.sys);
            const diaVal = parseInt(serverBuffer.dia);
            const bpmVal = parseInt(serverBuffer.bpm);
            const spo2Val = parseInt(serverBuffer.spo2);

            // 1. Reset visuel
            [els.sys, els.dia, els.bpm, els.spo2].forEach(el => el.classList.remove('alert-active'));

            if (isNaN(sysVal) || isNaN(diaVal) || isNaN(bpmVal) || isNaN(spo2Val)) return;

            let triggerAlert = false;

            // 2. Vérification PNI (Systolique ET Diastolique)
            
            // Systolique : Alerte si <= 100 ou >= 140
            const sysAlert = (sysVal <= 100 || sysVal >= 140);
            
            // Diastolique : Alerte si <= 65 ou >= 90 (NOUVEAUX SEUILS)
            const diaAlert = (diaVal <= 65 || diaVal >= 90);

            // Si l'un des deux est anormal, les DEUX clignotent
            if (sysAlert || diaAlert) {
                triggerAlert = true;
                els.sys.classList.add('alert-active');
                els.dia.classList.add('alert-active');
            }

            // 3. Vérification FC
            if (bpmVal > 90 || bpmVal < 50) {
                triggerAlert = true;
                els.bpm.classList.add('alert-active');
            }

            // 4. Vérification SpO2
            if (spo2Val < 95) {
                triggerAlert = true;
                els.spo2.classList.add('alert-active');
            }

            // Activation Sonore
            if (triggerAlert) {
                alertPlayer.currentTime = 0;
                alertPlayer.play().catch(e => console.log("Alerte audio bloquée"));
            }
        }

        function updateDisplayFromBuffer() {
            unblurAll();
            els.bpm.innerText = serverBuffer.bpm;
            els.spo2.innerText = serverBuffer.spo2;
            els.sys.innerText = serverBuffer.sys;
            els.dia.innerText = serverBuffer.dia;
            if(serverBuffer.sys !== '--' && serverBuffer.dia !== '--') {
                const map = Math.round((parseInt(serverBuffer.sys) + 2 * parseInt(serverBuffer.dia)) / 3);
                els.map.innerText = map;
            }
        }

        function startCycleCountdown(durationSeconds) {
            let timeLeft = durationSeconds;
            const updateTimerDisplay = () => {
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                els.countdown.innerText = `Prochaine : ${m}:${s.toString().padStart(2, '0')}`;
            };
            updateTimerDisplay();
            countdownTimer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    if (isContinuous) {
                        performMeasurement();
                        startCycleCountdown(120);
                    }
                }
            }, 1000);
        }

        function stopAllCycles() {
            isContinuous = false;
            clearInterval(countdownTimer);
            els.btnStop.disabled = true;
            
            els.btnCont.classList.remove('active-mode', 'btn-orange');
            els.btnOne.classList.remove('active-btn', 'btn-blue');
            
            els.countdown.innerText = "";
            els.status.classList.remove('analyzing-alert');
            
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            
            alertPlayer.pause();
            alertPlayer.currentTime = 0;
            
            [els.sys, els.dia, els.bpm, els.spo2].forEach(el => el.classList.remove('alert-active'));
        }

        function setValuesOpacity(op) { document.querySelectorAll('.value').forEach(el => el.style.opacity = op); }
        function unblurAll() { document.querySelectorAll('.value-blur').forEach(el => { el.classList.remove('value-blur'); el.classList.add('value-visible'); }); }
    </script>
</body>
</html>
