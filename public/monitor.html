<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeros - Moniteur de Signes Vitaux</title>
    <meta
      name="description"
      content="Interface de simulation de moniteur médical multiparamétrique."
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/monitor.css" />
  </head>

  <body class="monitor-mode">
    <audio id="audio-cuff" src="/ta.mp3" preload="auto"></audio>
    <audio id="alert-player" src="/alert.mp3" preload="auto"></audio>

    <div class="monitor-frame">
      <!-- Header Bar -->
      <header class="top-bar">
        <div class="monitor-logo brand-logo">AEROS</div>
        <div class="patient-info">
          ADULTE - STANDARD
          <span class="room-badge room-badge--cyan">CODE: <span id="display-room">--</span></span>
        </div>
        <div class="top-right">
          <time id="clock" aria-label="Heure actuelle">--:--</time>
          <a
            id="btn-switch-dinamap"
            class="fs-btn"
            href="dinamap.html"
            aria-label="Mode Dinamap A100"
            title="Passer en mode Dinamap A100"
            style="text-decoration: none; font-size: 0.95rem; font-weight: bold; width: auto; padding: 0 10px;"
          >
            📟 Dinamap
          </a>
          <button
            type="button"
            id="btn-fs"
            class="fs-btn"
            aria-label="Mode plein écran"
            title="Plein écran"
          >
            ⛶
          </button>
        </div>
      </header>

      <!-- 2x2 Vital Signs Grid -->
      <main class="monitor-grid">
        <!-- Module Fréquence Cardiaque -->
        <section class="param-box hr-box" aria-labelledby="label-hr">
          <div class="module-content">
            <div class="label-zone">
              <span id="label-hr" class="label-text">FC</span>
              <span class="label-unit">bpm</span>
            </div>
            <div class="value-zone">
              <span id="heart-icon" class="icon-heart" aria-hidden="true">♥</span>
              <span id="bpm-disp" class="value value-blur" aria-live="polite">--</span>
            </div>
          </div>
        </section>

        <!-- Module Saturation SpO2 -->
        <section class="param-box spo2-box" aria-labelledby="label-spo2">
          <div class="module-content">
            <div class="label-zone">
              <span id="label-spo2" class="label-text">SpO2</span>
              <span class="label-unit">%</span>
            </div>
            <div class="value-zone">
              <span id="spo2-disp" class="value value-blur" aria-live="polite">--</span>
            </div>
          </div>
          <div id="spo2-wave" class="wave-container" aria-hidden="true">
            <div class="pleth-wave">
              <svg viewBox="0 0 300 50" preserveAspectRatio="none">
                <path
                  d="M0,45 L10,45 L12,44 L14,40 L16,30 L18,18 L20,8 L22,4 L24,3 L26,5 L28,10 L30,14 L31,16 L32,15 L33,17 L35,22 L40,32 L50,40 L60,44 L75,45 L85,45 L87,44 L89,40 L91,30 L93,18 L95,8 L97,4 L99,3 L101,5 L103,10 L105,14 L106,16 L107,15 L108,17 L110,22 L115,32 L125,40 L135,44 L150,45 L160,45 L162,44 L164,40 L166,30 L168,18 L170,8 L172,4 L174,3 L176,5 L178,10 L180,14 L181,16 L182,15 L183,17 L185,22 L190,32 L200,40 L210,44 L225,45 L235,45 L237,44 L239,40 L241,30 L243,18 L245,8 L247,4 L249,3 L251,5 L253,10 L255,14 L256,16 L257,15 L258,17 L260,22 L265,32 L275,40 L285,44 L300,45"
                />
              </svg>
              <svg viewBox="0 0 300 50" preserveAspectRatio="none">
                <path
                  d="M0,45 L10,45 L12,44 L14,40 L16,30 L18,18 L20,8 L22,4 L24,3 L26,5 L28,10 L30,14 L31,16 L32,15 L33,17 L35,22 L40,32 L50,40 L60,44 L75,45 L85,45 L87,44 L89,40 L91,30 L93,18 L95,8 L97,4 L99,3 L101,5 L103,10 L105,14 L106,16 L107,15 L108,17 L110,22 L115,32 L125,40 L135,44 L150,45 L160,45 L162,44 L164,40 L166,30 L168,18 L170,8 L172,4 L174,3 L176,5 L178,10 L180,14 L181,16 L182,15 L183,17 L185,22 L190,32 L200,40 L210,44 L225,45 L235,45 L237,44 L239,40 L241,30 L243,18 L245,8 L247,4 L249,3 L251,5 L253,10 L255,14 L256,16 L257,15 L258,17 L260,22 L265,32 L275,40 L285,44 L300,45"
                />
              </svg>
            </div>
          </div>
        </section>

        <!-- Module Pression Non Invasif (PNI) -->
        <section class="param-box nibp-box" aria-labelledby="label-nibp">
          <div class="module-content">
            <div class="label-zone">
              <span id="label-nibp" class="label-text">PNI</span>
              <span class="label-unit">mmHg</span>
            </div>

            <div class="nibp-content">
              <div class="nibp-main">
                <span id="sys-disp" class="value value-blur" aria-live="polite">--</span>
                <span class="sep" aria-hidden="true">/</span>
                <span id="dia-disp" class="value value-blur" aria-live="polite">--</span>
              </div>
              <div class="nibp-sub">
                PAM (<span id="map-disp" class="value-blur" aria-live="polite">--</span>)
              </div>
            </div>
          </div>
        </section>

        <!-- Module Contrôles et Commandes -->
        <section class="param-box control-box" aria-label="Contrôles du moniteur">
          <div class="control-inner">
            <div class="buttons-row">
              <button type="button" id="btn-oneshot" class="monitor-btn btn-tension">
                Tension Start
              </button>
              <button type="button" id="btn-continue" class="monitor-btn btn-tension">
                Tension Auto
              </button>
              <button type="button" id="btn-spo2" class="monitor-btn btn-purple">
                SpO2 + Pouls
              </button>
              <button type="button" id="btn-stop" class="monitor-btn btn-red" disabled>
                Stop All
              </button>
              <button
                type="button"
                id="btn-mute"
                class="monitor-btn btn-mute"
                aria-label="Couper le son"
                title="Couper le son"
              >
                🔊
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/monitor.js"></script>
  </body>
</html>
