<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeros Pilot</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- VISUALISATION DES SEUILS D'ALERTE SUR LES SLIDERS --- */
        
        /* On épaissit un peu la barre pour bien voir les couleurs */
        .pilot-container input[type="range"]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
        }
        /* On recentre le bouton du slider */
        .pilot-container input[type="range"]::-webkit-slider-thumb {
            margin-top: -2px; 
            border: 2px solid #000; /* Petit contour noir pour le contraste */
        }

        /* 1. FC (BPM) : 0 à 250 bpm 
           Sécurité : 50 à 90
           Calcul : 50/250 = 20% | 90/250 = 36% 
        */
        #bpm-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, 
                #c0392b 0%, #c0392b 20%,  /* Rouge (Danger bas) */
                #2ecc71 20%, #2ecc71 36%, /* Vert (Normal) */
                #c0392b 36%, #c0392b 100% /* Rouge (Danger haut) */
            ) !important;
        }

        /* 2. SpO2 : 50 à 100 % 
           Sécurité : > 95%
           Plage totale = 50. Seuil à 95 (donc 45 unités depuis le début)
           Calcul : 45/50 = 90%
        */
        #spo2-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, 
                #c0392b 0%, #c0392b 90%,  /* Rouge */
                #2ecc71 90%, #2ecc71 100% /* Vert */
            ) !important;
        }

        /* 3. Systolique : 0 à 250 mmHg
           Sécurité : 100 à 140
           Calcul : 100/250 = 40% | 140/250 = 56%
        */
        #sys-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, 
                #c0392b 0%, #c0392b 40%, 
                #2ecc71 40%, #2ecc71 56%, 
                #c0392b 56%, #c0392b 100%
            ) !important;
        }

        /* 4. Diastolique : 0 à 180 mmHg
           Sécurité : 80 à 100
           Calcul : 80/180 ≈ 44.4% | 100/180 ≈ 55.5%
        */
        #dia-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, 
                #c0392b 0%, #c0392b 44.4%, 
                #2ecc71 44.4%, #2ecc71 55.5%, 
                #c0392b 55.5%, #c0392b 100%
            ) !important;
        }
        
        /* Petit texte d'aide pour les seuils */
        .range-info {
            font-size: 0.7rem; color: #888; margin-top: 2px; text-align: right; font-style: italic;
        }
    </style>
</head>
<body class="pilote-mode">

    <div class="pilot-container">
        
        <div class="pilot-header">
            <span class="brand-logo" style="font-size: 1.2rem;">AEROS</span>
            <span>Console Pilote</span>
        </div>

        <div class="server-status-box">
            <h4>Valeurs Serveur (En attente)</h4>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">FC</span>
                    <span id="srv-bpm" class="val-hr">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">SpO2</span>
                    <span id="srv-spo2" class="val-spo2">--</span>%
                </div>
                <div class="status-item">
                    <span class="status-label">TA</span>
                    <span class="val-nibp">
                        <span id="srv-sys">--</span>/<span id="srv-dia">--</span>
                    </span>
                </div>
            </div>
        </div>
        
        <div class="control-grid">
            
            <div class="control-group hr-group">
                <label>Fréquence Cardiaque (BPM)</label>
                <div class="input-wrapper">
                    <input type="number" id="bpm" value="80" min="0" max="250" oninput="syncSlider('bpm')">
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="bpm-slider" min="0" max="250" value="80" oninput="syncNumber('bpm')">
                    <div class="range-info">Zone sûre : 50 - 90</div>
                </div>
            </div>

            <div class="control-group spo2-group">
                <label>Saturation O2 (%)</label>
                <div class="input-wrapper">
                    <input type="number" id="spo2" value="98" min="50" max="100" oninput="syncSlider('spo2')">
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="spo2-slider" min="50" max="100" value="98" oninput="syncNumber('spo2')">
                    <div class="range-info">Zone sûre : > 95%</div>
                </div>
            </div>

            <div class="control-group nibp-group">
                <label>Pression (Sys / Dia)</label>
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1">
                        <input type="number" id="sys" value="120" oninput="syncSlider('sys')">
                        <div class="slider-wrapper">
                            <input type="range" id="sys-slider" min="0" max="250" value="120" oninput="syncNumber('sys')">
                            <div class="range-info">Sûre: 100-140</div>
                        </div>
                    </div>
                    <div style="flex:1">
                        <input type="number" id="dia" value="80" oninput="syncSlider('dia')">
                        <div class="slider-wrapper">
                            <input type="range" id="dia-slider" min="0" max="180" value="80" oninput="syncNumber('dia')">
                            <div class="range-info">Sûre: 80-100</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <button id="btn-update" onclick="sendData()">TRANSMETTRE</button>
        <div id="status"></div>
        
        <div class="pilot-footer">
             <a href="index.html" style="color:#444; text-decoration:none;">Quitter</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        socket.on('updateParams', (data) => {
            document.getElementById('srv-bpm').innerText = data.bpm;
            document.getElementById('srv-spo2').innerText = data.spo2;
            document.getElementById('srv-sys').innerText = data.sys;
            document.getElementById('srv-dia').innerText = data.dia;
        });

        function syncSlider(id) {
            document.getElementById(id + '-slider').value = document.getElementById(id).value;
        }
        function syncNumber(id) {
            document.getElementById(id).value = document.getElementById(id + '-slider').value;
        }

        function sendData() {
            const data = {
                bpm: document.getElementById('bpm').value,
                spo2: document.getElementById('spo2').value,
                sys: document.getElementById('sys').value,
                dia: document.getElementById('dia').value
            };
            socket.emit('sendData', data);
            const btn = document.getElementById('btn-update');
            const originalText = btn.innerText;
            btn.style.background = "#2ecc71";
            btn.innerText = "ENVOYÉ ✓";
            setTimeout(() => {
                btn.style.background = ""; 
                btn.innerText = originalText;
            }, 1000);
        }
    </script>
</body>
</html>
