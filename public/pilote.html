<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeros Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pilote-mode">

    <div class="pilot-container">
        <button id="btn-update" onclick="sendData()">TRANSMETTRE DONNÉES</button>
        
        <hr style="border-color: #222; margin: 15px 0;">

        <div class="ptt-container">
            <button id="btn-ptt" class="ptt-btn">
                <span class="mic-icon">🎤</span>
                <span id="ptt-label">MAINTENIR POUR PARLER</span>
            </button>
        </div>
        
        <div class="pilot-footer">
             <a href="index.html" style="color:#444; text-decoration:none;">Quitter</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // ... (Code existant socket.on updateParams et fonctions sync) ...
        socket.on('updateParams', (data) => {
            document.getElementById('srv-bpm').innerText = data.bpm;
            document.getElementById('srv-spo2').innerText = data.spo2;
            document.getElementById('srv-sys').innerText = data.sys;
            document.getElementById('srv-dia').innerText = data.dia;
        });

        function syncSlider(id) { document.getElementById(id + '-slider').value = document.getElementById(id).value; }
        function syncNumber(id) { document.getElementById(id).value = document.getElementById(id + '-slider').value; }

        function sendData() {
            const data = {
                bpm: document.getElementById('bpm').value,
                spo2: document.getElementById('spo2').value,
                sys: document.getElementById('sys').value,
                dia: document.getElementById('dia').value
            };
            socket.emit('sendData', data);
            const btn = document.getElementById('btn-update');
            const originalText = btn.innerText;
            btn.style.background = "#2ecc71";
            btn.innerText = "ENVOYÉ ✓";
            setTimeout(() => { btn.style.background = ""; btn.innerText = originalText; }, 1000);
        }

        // --- LOGIQUE PUSH TO TALK (PTT) ---
        const pttBtn = document.getElementById('btn-ptt');
        const pttLabel = document.getElementById('ptt-label');
        let mediaRecorder;
        let audioChunks = [];

        // 1. Demander l'accès au micro au chargement
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    // Création du recorder
                    mediaRecorder = new MediaRecorder(stream);
                    
                    // Quand des données sont prêtes (tous les X ms), on envoie au serveur
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            socket.emit('voice-data', event.data);
                        }
                    };
                    
                    console.log("Microphone prêt.");
                })
                .catch(err => {
                    console.error("Erreur Micro:", err);
                    pttLabel.innerText = "MICRO NON DÉTECTÉ";
                    pttBtn.disabled = true;
                    pttBtn.style.background = "#333";
                });
        } else {
            pttLabel.innerText = "NON SUPPORTÉ";
        }

        // 2. Gestion des événements Souris & Touch (Mobile)
        const startRecording = (e) => {
            e.preventDefault(); // Empêche le clic fantôme sur mobile
            if (mediaRecorder && mediaRecorder.state === "inactive") {
                // On enregistre par petits paquets de 250ms pour avoir du semi-temps réel
                mediaRecorder.start(250); 
                pttBtn.classList.add('transmitting');
                pttLabel.innerText = "EN LIGNE...";
            }
        };

        const stopRecording = (e) => {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                pttBtn.classList.remove('transmitting');
                pttLabel.innerText = "MAINTENIR POUR PARLER";
            }
        };

        // Événements Souris
        pttBtn.addEventListener('mousedown', startRecording);
        pttBtn.addEventListener('mouseup', stopRecording);
        pttBtn.addEventListener('mouseleave', stopRecording); // Si on sort du bouton

        // Événements Tactiles (Mobile/Tablette)
        pttBtn.addEventListener('touchstart', startRecording);
        pttBtn.addEventListener('touchend', stopRecording);

    </script>
</body>
</html>
