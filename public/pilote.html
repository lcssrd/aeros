<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeros Control - Panneau Pilote</title>
    <meta name="description" content="Panneau de commande instructeur pour le simulateur Aeros." />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/pilote.css" />
  </head>

  <body class="pilote-mode">
    <main class="pilot-container">
      <header class="live-status-bar">
        <div class="live-title">
          <span>
            Moniteur Élève
            <span class="room-badge">CODE: <span id="display-room">--</span></span>
          </span>
          <span class="live-indicator" aria-label="Statut en direct" title="Connecté"></span>
        </div>
        <div class="status-grid">
          <div class="status-item">
            <span class="val val-bpm" id="srv-bpm">--</span>
            <span class="label">FC (bpm)</span>
          </div>
          <div class="status-item">
            <span class="val val-spo2" id="srv-spo2">--</span>
            <span class="label">SpO2 (%)</span>
          </div>
          <div class="status-item">
            <span class="val val-nibp">
              <span id="srv-sys">--</span>/<span id="srv-dia">--</span>
            </span>
            <span class="label">TA (mmHg)</span>
          </div>
        </div>
      </header>

      <!-- Fréquence Cardiaque -->
      <section class="control-card control-card--hr" aria-labelledby="title-hr">
        <div class="card-header">
          <h2 id="title-hr" class="card-title card-title--hr">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
            Fréquence Cardiaque
          </h2>
          <input
            type="number"
            id="bpm"
            class="input-display"
            value="80"
            min="0"
            max="250"
            aria-label="Valeur de la Fréquence Cardiaque en battements par minute"
          />
        </div>
        <div class="slider-wrapper">
          <input
            type="range"
            id="bpm-slider"
            min="0"
            max="250"
            value="80"
            aria-label="Curseur Fréquence Cardiaque"
          />
          <div class="range-info">Zone sûre : 50 - 90 bpm</div>
        </div>
      </section>

      <!-- Saturation SpO2 -->
      <section class="control-card control-card--spo2" aria-labelledby="title-spo2">
        <div class="card-header">
          <h2 id="title-spo2" class="card-title card-title--spo2">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"
              />
            </svg>
            Saturation (SpO2)
          </h2>
          <input
            type="number"
            id="spo2"
            class="input-display"
            value="98"
            min="70"
            max="100"
            aria-label="Valeur de la saturation en oxygène en pourcentage"
          />
        </div>
        <div class="slider-wrapper">
          <input
            type="range"
            id="spo2-slider"
            min="70"
            max="100"
            value="98"
            aria-label="Curseur Saturation SpO2"
          />
          <div class="range-info">Zone sûre : &gt; 95%</div>
        </div>
      </section>

      <!-- Pression Artérielle -->
      <section class="control-card control-card--nibp" aria-labelledby="title-nibp">
        <div class="card-header">
          <h2 id="title-nibp" class="card-title card-title--nibp">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"
              />
            </svg>
            Pression Artérielle (TA)
          </h2>
        </div>

        <div class="nibp-group">
          <div class="nibp-half">
            <div class="nibp-label-row">
              <label for="sys" class="nibp-label">Systolique</label>
              <input type="number" id="sys" class="input-display" value="120" min="50" max="230" />
            </div>
            <input
              type="range"
              id="sys-slider"
              min="50"
              max="230"
              value="120"
              aria-label="Curseur Pression Systolique"
            />
          </div>

          <div class="nibp-half">
            <div class="nibp-label-row">
              <label for="dia" class="nibp-label">Diastolique</label>
              <input type="number" id="dia" class="input-display" value="80" min="20" max="150" />
            </div>
            <input
              type="range"
              id="dia-slider"
              min="20"
              max="150"
              value="80"
              aria-label="Curseur Pression Diastolique"
            />
          </div>
        </div>
        <div class="range-info">Sys: 100-140 | Dia: 65-90 mmHg</div>
      </section>

      <!-- Action Button -->
      <div class="action-area">
        <button type="button" id="btn-update" class="btn-transmit">Appliquer les valeurs</button>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/pilote.js"></script>
  </body>
</html>
