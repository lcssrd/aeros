<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeros Voice Speaker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Style spécifique pour cette page très simple */
        body.voice-mode {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #111; color: #fff;
        }
        .speaker-visual {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #333 10%, #000 70%);
            border-radius: 50%;
            border: 5px solid #444;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            transition: all 0.1s;
        }
        .speaking {
            border-color: #00e5ff;
            box-shadow: 0 0 40px #00e5ff;
            transform: scale(1.05);
        }
        .status-text { font-family: monospace; color: #666; }
        .start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body class="voice-mode">

    <div id="overlay" class="start-overlay">
        <h1>CLIQUEZ POUR ACTIVER LE SON</h1>
    </div>

    <div id="speaker" class="speaker-visual">
        <span style="font-size: 3rem;">🔊</span>
    </div>
    <div id="status" class="status-text">EN ATTENTE...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const overlay = document.getElementById('overlay');
        const speaker = document.getElementById('speaker');
        const status = document.getElementById('status');
        
        // File d'attente audio pour éviter les coupures
        let audioQueue = [];
        let isPlaying = false;

        // Activation Audio (Politique navigateur)
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            status.innerText = "PRÊT À RECEVOIR";
        });

        // Réception des paquets audio
        socket.on('voice-stream', (arrayBuffer) => {
            const blob = new Blob([arrayBuffer], { 'type' : 'audio/webm; codecs=opus' });
            audioQueue.push(blob);
            processQueue();
        });

        function processQueue() {
            if (isPlaying || audioQueue.length === 0) return;

            isPlaying = true;
            status.innerText = "TRANSMISSION...";
            speaker.classList.add('speaking');

            const blob = audioQueue.shift();
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);

            audio.onended = () => {
                isPlaying = false;
                URL.revokeObjectURL(audioUrl); // Nettoyage mémoire
                if (audioQueue.length === 0) {
                    speaker.classList.remove('speaking');
                    status.innerText = "EN ATTENTE...";
                }
                processQueue(); // Jouer le suivant
            };

            audio.play().catch(e => console.error("Erreur lecture:", e));
        }
    </script>
</body>
</html>
